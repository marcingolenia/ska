name: skavar_projectName workflow

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed
    branches:
      - master
    paths:
      - "services/skavar_projectName/**"
env:
  SERVICE_NAME: skavar_projectName
  SERVICE_PATH: services/skavar_projectName
  DOCKER_IMAGE: skavar_dockerImageToDeploy
  CLOUDFLARE_API_TOKEN: ${{ secrets.FILES_CLOUDRUN_CLOUDFLARE_API_TOKEN }}

permissions:
  actions: write
  checks: write
  contents: write
  deployments: write
  issues: write
  packages: write
  pages: write
  pull-requests: write
  repository-projects: write
  security-events: write
  statuses: write

concurrency:
  group: ${{ github.workflow }}-${{ github.pull_request.merged || github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event.pull_request.merged != true }}

defaults:
  run:
    working-directory: services/skavar_projectName

jobs:
  test:
    name: Verify linting, run test and validte deployment
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == false
    steps:
      - name: Checkout sourcode
        uses: actions/checkout@v3
      - name: Add PR label
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ["skavar_teamToLabelOnPr"]
            })
      - uses: actions/setup-go@v3
        with:
          go-version: "1.19"
      - name: Cache Go
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ env.SERVICE_NAME }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ env.SERVICE_NAME }}-go-

      - name: Vet code
        working-directory: ${{ env.SERVICE_PATH }}
        run: go vet ./...

      - name: Validate dependencies
        working-directory: ${{ env.SERVICE_PATH }}
        run: go mod verify

      - name: Run tests and show coverage report
        uses: ./.github/actions/tests-coverage/go
        with:
          inflile: coverage-report.out
          working-directory: ${{ env.SERVICE_PATH }}
          report-title: skavar_projectName test coverage report
          test-command: |
            go test -coverpkg=`go list ./... | tr '\n\' ','` -coverprofile=coverage-report.out -covermode=count -v ./...
            go tool cover -func=coverage-report.out | grep total

      - name: Build Docker Image
        working-directory: ${{ env.SERVICE_PATH }}
        run: |-
          docker build -f ./Dockerfile .
#+ska_iac_and_deployment_with_terraform
      - name: Cache private key
        id: private-key
        uses: actions/cache@v3
        with:
          path: |
            ${{ env.SERVICE_PATH }}/terraform/private_key.pem
          key: skavar_projectName-private-key
          restore-keys: |
            skavar_projectName-private-key

      - name: Generate private key for CSR
        working-directory: ${{ env.SERVICE_PATH }}/terraform
        if: steps.private-key.outputs.cache-hit != 'true'
        run: openssl ecparam -genkey -name prime256v1 -noout -out private_key.pem

      - name: GCP login
        id: auth
        uses: "google-github-actions/auth@v1"
        with:
          credentials_json: "${{ secrets.GCR_JSON_KEY }}"

      - name: Config Terraform plugin cache
        run: |
          echo 'plugin_cache_dir="$HOME/.terraform.d/plugin-cache"' >~/.terraformrc
          mkdir --parents ~/.terraform.d/plugin-cache

      - name: Cache Terraform
        id: terraform-cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.terraform.d/plugin-cache
          key: ${{ runner.os }}-terraform-${{ hashFiles('${{ env.SERVICE_PATH }}/terraform/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_wrapper: false
          terraform_version: 1.3.1
      - name: Terraform fmt
        working-directory: ${{ env.SERVICE_PATH }}/terraform
        id: fmt
        run: terraform fmt -check

      - name: Terraform Init
        working-directory: ${{ env.SERVICE_PATH }}/terraform
        id: init
        run: terraform init

      - name: Terraform Validate
        working-directory: ${{ env.SERVICE_PATH }}/terraform
        id: validate
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.SERVICE_PATH }}/terraform
        id: plan
        run: terraform plan -var="docker_image=${{ env.DOCKER_IMAGE }}"



  build-and-deploy:
    if: github.event.pull_request.merged == true
    name: Build and deploy app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to GCR
        uses: docker/login-action@v2
        with:
          registry: europe-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCR_JSON_KEY }}
      - name: Build and Push Container
        id: build_docker
        uses: docker/build-push-action@v4
        with:
          context: ${{ env.SERVICE_PATH }}
          file: ${{ env.SERVICE_PATH }}/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Cache private key
        id: private-key
        uses: actions/cache@v3
        with:
          path: |
            ${{ env.SERVICE_PATH }}/terraform/private_key.pem
          key: skavar_projectName-private-key
          restore-keys: |
            skavar_projectName-private-key

      - name: Generate private key for CSR
        working-directory: ${{ env.SERVICE_PATH }}/terraform
        if: steps.private-key.outputs.cache-hit != 'true'
        run: openssl ecparam -genkey -name prime256v1 -noout -out private_key.pem

      - name: GCP Login
        id: auth
        uses: "google-github-actions/auth@v0"
        with:
          credentials_json: "${{ secrets.GCR_JSON_KEY }}"
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_wrapper: false
          terraform_version: 1.3.1
      - name: Terraform Init
        working-directory: ${{ env.SERVICE_PATH }}/terraform
        id: init
        run: terraform init
      - name: Terraform Validate
        working-directory: ${{ env.SERVICE_PATH }}/terraform
        id: validate
        run: terraform validate
      - name: Terraform Apply
        working-directory: ${{ env.SERVICE_PATH }}/terraform
        run: terraform apply -auto-approve -input=false -var="docker_image=${{ env.DOCKER_IMAGE }}:${{ github.sha }}"
#-ska_iac_and_deployment_with_terraform