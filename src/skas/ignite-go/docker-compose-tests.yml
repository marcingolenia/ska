version: '3.8'
services:
  db:
    image: postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: igniteprocurement
    ports:
        - 6432:5432
  pub-sub-emulator:
    image: google/cloud-sdk:414.0.0
    command: [ "gcloud", "beta", "emulators", "pubsub", "start", "--host-port=0.0.0.0:8085", "--project=pubsubgo" ]
    ports:
      - "8085:8085"